<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Player - No Ads</title>
<script src="https://sdk.scdn.co/spotify-player.js"></script>
<style>
:root{
  --bg:#0a0a0a; --card:#161616; --text:#ffffff;
  --accent:#1DB954; --muted:#888;
}
body.light{ --bg:#ffffff; --card:#f2f2f2; --text:#111111; --muted:#666; }
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;transition:.3s}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px}
.hamburger{font-size:26px;background:none;border:none;color:var(--text);cursor:pointer}
.logo{font-weight:800;font-size:20px}.logo span{color:var(--accent)}
.drawer{position:fixed;top:0;left:-300px;width:280px;height:100%;background:var(--card);padding:24px;transition:.3s;z-index:100;overflow-y:auto}
.drawer.open{left:0}
.drawer h3{margin:18px 0 8px;font-size:14px;text-transform:uppercase;color:var(--muted)}
.drawer label{display:flex;justify-content:space-between;align-items:center;margin:10px 0;font-size:14px}
input[type="color"]{width:40px;height:30px;border:none;background:none;cursor:pointer}
input[type="range"]{width:100%;accent-color:var(--accent)}
.btn{background:var(--accent);color:#fff;border:none;padding:10px 16px;border-radius:20px;cursor:pointer;font-weight:600;width:100%;margin-top:8px}
.btn-outline{background:transparent;border:1px solid var(--muted);color:var(--text)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:90}
.overlay.show{display:block}
main{max-width:520px;margin:20px auto;padding:0 20px}
.player-card{background:var(--card);border-radius:20px;padding:28px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#cover{width:240px;height:240px;border-radius:16px;object-fit:cover;background:#333;margin-bottom:18px}
#trackName{font-size:22px;font-weight:700} #artistName{color:var(--muted);margin:6px 0 20px}
.controls{display:flex;justify-content:center;align-items:center;gap:20px;margin:20px 0}
.ctrl-btn{background:none;border:none;color:var(--text);font-size:28px;cursor:pointer}
.ctrl-btn.play{background:var(--accent);color:#fff;width:64px;height:64px;border-radius:50%;font-size:26px}
.token-box{margin-top:20px;text-align:left}
.token-box input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--muted);background:var(--bg);color:var(--text);margin-top:8px}
.track-list{margin-top:24px;text-align:left}
.track-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;cursor:pointer}
.track-item:hover{background:var(--bg)}.track-item img{width:48px;height:48px;border-radius:8px}
</style>
</head>
<body>

<div class="overlay" id="overlay"></div>
<nav class="drawer" id="drawer">
  <h2>⚙️ Pengaturan</h2>
  <h3>Tampilan</h3>
  <label>Mode Terang <input type="checkbox" id="themeToggle"></label>
  <label>Warna Accent <input type="color" id="accentPicker" value="#1DB954"></label>
  <label>Warna Background <input type="color" id="bgPicker" value="#0a0a0a"></label>
  <h3>Audio</h3>
  <label>Volume</label>
  <input type="range" id="volumeSlider" min="0" max="100" value="50">
  <h3>Spotify</h3>
  <button class="btn btn-outline" id="refreshTop">Refresh Top Tracks</button>
  <p style="font-size:12px;color:var(--muted);margin-top:12px">Gratis • No Iklan • Data hanya di browser kamu</p>
</nav>

<header>
  <button class="hamburger" id="menuBtn">☰</button>
  <div class="logo">My<span>Spotify</span></div>
  <div style="width:26px"></div>
</header>

<main>
  <div class="player-card">
    <img id="cover" src="https://via.placeholder.com/240" alt="cover">
    <div id="trackName">Belum terhubung</div>
    <div id="artistName">Masukkan token lalu connect</div>
    <div class="controls">
      <button class="ctrl-btn" id="prevBtn">⏮</button>
      <button class="ctrl-btn play" id="togglePlay">▶</button>
      <button class="ctrl-btn" id="nextBtn">⏭</button>
    </div>
    <div class="token-box">
      <label style="font-size:13px">Spotify Access Token:</label>
      <input type="password" id="tokenInput" placeholder="paste token dari developer.spotify.com">
      <button class="btn" id="connectBtn" style="margin-top:10px">Connect Player</button>
      <div id="status" style="font-size:12px;margin-top:8px;color:var(--muted)"></div>
    </div>
  </div>
  <div class="track-list">
    <h3 style="margin-bottom:10px">🔥 Top Tracks Kamu</h3>
    <div id="topTracks"><p style="color:var(--muted)">Connect dulu untuk load.</p></div>
  </div>
</main>

<script>
let player, deviceId, token = localStorage.getItem('sp_token') || '';
document.getElementById('tokenInput').value = token;

const drawer = document.getElementById('drawer');
const overlay = document.getElementById('overlay');
document.getElementById('menuBtn').onclick = ()=>{drawer.classList.add('open');overlay.classList.add('show')};
overlay.onclick = ()=>{drawer.classList.remove('open');overlay.classList.remove('show')};

// Custom color
document.getElementById('themeToggle').onchange = e=> document.body.classList.toggle('light', e.target.checked);
document.getElementById('accentPicker').oninput = e=> document.documentElement.style.setProperty('--accent', e.target.value);
document.getElementById('bgPicker').oninput = e=> document.documentElement.style.setProperty('--bg', e.target.value);
document.getElementById('volumeSlider').oninput = e=>{ if(player) player.setVolume(e.target.value/100) };

async function api(endpoint, method='GET', body=null){
  const res = await fetch(`https://api.spotify.com/${endpoint}`,{
    headers:{Authorization:`Bearer ${token}`}, method, body: body?JSON.stringify(body):null
  });
  return res.json();
}

window.onSpotifyWebPlaybackSDKReady = ()=>{
  document.getElementById('connectBtn').onclick = ()=>{
    token = document.getElementById('tokenInput').value.trim();
    if(!token){alert('Masukkan token dulu');return}
    localStorage.setItem('sp_token', token);
    initPlayer();
  };
  if(token) initPlayer();
};

function initPlayer(){
  player = new Spotify.Player({name:'My Custom Web Player', getOAuthToken:cb=>cb(token), volume:0.5});
  player.addListener('ready', async ({device_id})=>{
    deviceId=device_id; document.getElementById('status').textContent='✅ Connected: '+device_id;
    await api(`v1/me/player`, 'PUT', {device_ids:[device_id], play:false});
    loadTopTracks();
  });
  player.addListener('player_state_changed', state=>{
    if(!state) return;
    const t=state.track_window.current_track;
    document.getElementById('cover').src=t.album.images[0].url;
    document.getElementById('trackName').textContent=t.name;
    document.getElementById('artistName').textContent=t.artists.map(a=>a.name).join(', ');
    document.getElementById('togglePlay').textContent = state.paused? '▶' : '⏸';
  });
  player.addListener('authentication_error', ({message})=> document.getElementById('status').textContent='❌ Auth error: token expired');
  player.connect();

  document.getElementById('togglePlay').onclick=()=>player.togglePlay();
  document.getElementById('nextBtn').onclick=()=>player.nextTrack();
  document.getElementById('prevBtn').onclick=()=>player.previousTrack();
  document.getElementById('refreshTop').onclick=loadTopTracks;
}

async function loadTopTracks(){
  try{
    const data = await api('v1/me/top/tracks?time_range=long_term&limit=5');
    const box=document.getElementById('topTracks'); box.innerHTML='';
    data.items.forEach(tr=>{
      const div=document.createElement('div'); div.className='track-item';
      div.innerHTML=`<img src="${tr.album.images[2].url}"><div><div style="font-weight:600">${tr.name}</div><div style="font-size:12px;color:var(--muted)">${tr.artists.map(a=>a.name).join(', ')}</div></div>`;
      div.onclick=()=> api(`v1/me/player/play?device_id=${deviceId}`,'PUT',{uris:[tr.uri]});
      box.appendChild(div);
    });
  }catch(e){ document.getElementById('topTracks').innerHTML='<p>Token expired, ambil token baru.</p>' }
}
</script>
</body>
</html>
